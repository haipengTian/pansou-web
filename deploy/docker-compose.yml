name: pansou

services:
  pansou:
    image: "${PANSOU_IMAGE:-ghcr.io/haipengtian/pansou-web:production}"
    container_name: pansou
    restart: unless-stopped
    pull_policy: always

    ports:
      # 仅绑定宿主机回环地址，公网流量由宿主机 Nginx 的 HTTPS 站点转发。
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HTTP_PORT:-9000}:80"

    env_file:
      - .env
    environment:
      # Nginx 和 Go 后端运行在同一个容器内。
      PANSOU_HOST: "127.0.0.1"
      PANSOU_PORT: "8888"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      # ADMIN_USERS 是管理后台的救急管理员账号（后台只读）；客户账号请在 /admin 中创建。
      ADMIN_USERS: "${ADMIN_USERS:?请在 deploy/.env 中设置 ADMIN_USERS}"
      AUTH_USERS: "${AUTH_USERS:-}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?请在 deploy/.env 中设置 AUTH_JWT_SECRET}"

    volumes:
      - pansou-data:/app/data

    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    stop_grace_period: 25s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pansou-data:
    name: pansou-data
