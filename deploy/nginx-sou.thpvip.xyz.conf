# sou.thpvip.xyz -> PanSou 一体容器（127.0.0.1:9000）
#
# 证书路径按 Certbot 默认目录编写。如果这台服务器已有证书但路径不同，
# 请把 ssl_certificate 和 ssl_certificate_key 改成实际路径。

server {
    listen 80;
    listen [::]:80;
    server_name sou.thpvip.xyz;

    # 保留 ACME HTTP-01 验证入口，其余请求跳转 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sou.thpvip.xyz;

    ssl_certificate /etc/letsencrypt/live/sou.thpvip.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sou.thpvip.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
