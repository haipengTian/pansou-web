name: 构建并发布前后端一体镜像

on:
  push:
    branches:
      - production
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches:
      - develop
      - production
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出前端 production 代码
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: 检出自己的后端 production 代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pansou
          ref: production
          path: backend

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 设置Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 构建多架构后端
        working-directory: backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o pansou-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o pansou-arm64 .
          chmod +x pansou-amd64 pansou-arm64

      - name: 准备一体镜像构建目录
        run: |
          mkdir -p build-context
          cp -r frontend/dist build-context/frontend-dist
          cp backend/pansou-amd64 backend/pansou-arm64 build-context/
          cp frontend/Dockerfile frontend/start.sh build-context/
          chmod +x build-context/start.sh

      - name: 设置QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录GitHub容器注册表
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
            type=sha,format=short

      - name: 构建并推送一体镜像
        uses: docker/build-push-action@v5
        with:
          context: build-context
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
